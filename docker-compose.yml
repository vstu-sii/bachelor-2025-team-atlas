version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: autopitch_postgres
    environment:
      POSTGRES_DB: autopitch
      POSTGRES_USER: autopitch_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-autopitch123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - autopitch_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autopitch_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Cache and Queues
  redis:
    image: redis:7-alpine
    container_name: autopitch_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - autopitch_network
    command: redis-server --appendonly yes

  # Celery Worker
  celery_worker:
    build: ./backend
    container_name: autopitch_celery_worker
    command: celery -A app.workers.celery_app worker --loglevel=info -Q parsing,ai_tasks,export
    environment:
      - DATABASE_URL=postgresql://autopitch_user:${DB_PASSWORD}@postgres:5432/autopitch
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    volumes:
      - uploads:/app/uploads
      - templates:/app/templates
    depends_on:
      - postgres
      - redis
    networks:
      - autopitch_network

  # FastAPI Backend
  backend:
    build: ./backend
    container_name: autopitch_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - DATABASE_URL=postgresql://autopitch_user:${DB_PASSWORD}@postgres:5432/autopitch
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
      - templates:/app/templates
      - logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - autopitch_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Next.js Frontend
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: autopitch_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws
      - NEXT_PUBLIC_TELEGRAM_BOT_ID=${TELEGRAM_BOT_ID}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - autopitch_network

  # Nginx Proxy
  nginx:
    image: nginx:alpine
    container_name: autopitch_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - uploads:/var/www/uploads:ro
      - templates:/var/www/templates:ro
    depends_on:
      - backend
      - frontend
    networks:
      - autopitch_network

networks:
  autopitch_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  uploads:
  templates:
  logs:
